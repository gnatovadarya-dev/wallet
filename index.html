<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Гаманець Дар'ї</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Гаманець">
<meta name="theme-color" content="#6E33AE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
/* Layout: одна колонка-«гаманець» до 560px, вкладки внизу, кнопка додавання над ними */
:root{
  --bg:#F8F3FC; --surface:#FFFFFF; --sunk:#EFE4F8; --fg:#24132F; --muted:#6E5A7C; --line:#E2D2EE;
  --accent:#7A3DB8; --accent-ink:#FFFFFF; --accent-soft:#EADCF8; --pink:#D9488A; --lilac:#B794E0;
  --hero-a:#6E33AE; --hero-b:#D9488A;
  --good:#2B7A4B; --warn:#A8690F; --bad:#B23A30; --warn-soft:#F6E7CC; --bad-soft:#F5D9D5; --good-soft:#D8EEDF;
  --c1:#7A3DB8; --c2:#D9488A; --c3:#3D5A99; --c4:#C27C1E; --c5:#5E8C2E; --c6:#A77BDB; --c7:#2C8C9E; --c8:#8A7F92;
  --f-display:"Unbounded", "Manrope", system-ui, sans-serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#140D1B; --surface:#1E1528; --sunk:#291D36; --fg:#F1E8F8; --muted:#AE9CBE; --line:#3A2A4A;
  --accent:#BE92F2; --accent-ink:#1A0F24; --accent-soft:#33224A; --pink:#F27DB2; --lilac:#9C7BC6;
  --hero-a:#5B2A93; --hero-b:#B23A73;
  --good:#5BC284; --warn:#E3A746; --bad:#EE7A6E; --warn-soft:#3A2E17; --bad-soft:#3D2220; --good-soft:#1B3526;
  --c1:#BE92F2; --c2:#F27DB2; --c3:#7C9BE0; --c4:#E3A746; --c5:#9CC86A; --c6:#D6B8F7; --c7:#5FC3D3; --c8:#B8ABC4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#140D1B; --surface:#1E1528; --sunk:#291D36; --fg:#F1E8F8; --muted:#AE9CBE; --line:#3A2A4A;
  --accent:#BE92F2; --accent-ink:#1A0F24; --accent-soft:#33224A; --pink:#F27DB2; --lilac:#9C7BC6;
  --hero-a:#5B2A93; --hero-b:#B23A73;
  --good:#5BC284; --warn:#E3A746; --bad:#EE7A6E; --warn-soft:#3A2E17; --bad-soft:#3D2220; --good-soft:#1B3526;
  --c1:#BE92F2; --c2:#F27DB2; --c3:#7C9BE0; --c4:#E3A746; --c5:#9CC86A; --c6:#D6B8F7; --c7:#5FC3D3; --c8:#B8ABC4;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:120px;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.1;display:grid}
.brand small{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--pink);letter-spacing:.04em}
.month{display:flex;align-items:center;gap:4px}
.month span{min-width:118px;text-align:center;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
.ibtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ibtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:8px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.hero{background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 100%);color:#FFFFFF;border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgb(255 255 255 / .1)}
.hero>*{position:relative}
.hero .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,8vw,38px);line-height:1.1}
.hero .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero .row div{display:grid;gap:2px}
.hero .row b{font-size:17px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:600;border-radius:999px;padding:5px 10px}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--good-soft);color:var(--good)}
.list{display:grid}
.item{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%}
.item .t{min-width:0}
.item .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.item .t small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.amt{font-weight:700;text-align:right;white-space:nowrap}
.amt.inc{color:var(--good)}
.amt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.del{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 0}
.del.armed{color:var(--bad);font-weight:700}
.donut{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center}
@media (max-width:380px){.donut{grid-template-columns:1fr;justify-items:center}}
.legend{display:grid;gap:6px;font-size:13px;min-width:0;width:100%}
.legend div{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center}
.bars svg{width:100%;height:auto;display:block}
.bud{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.bud:first-child{border-top:0}
.bud .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bud .h b{font-weight:600}
.bud .h span{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.lim{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.lim input{width:110px}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);padding:0}
.imp-card{background:var(--accent-soft);border:0}
.imp-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.imp-row:first-child{border-top:0}
.imp-row.dup{opacity:.5}
.imp-row select{font-size:14px;padding:5px 8px;margin-top:4px}
.imp-row small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.imp-list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:0 12px}
.steps{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));width:0}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.empty{text-align:center;color:var(--muted);padding:20px 8px;display:grid;gap:10px;justify-items:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:none;padding:8px 2px;border-radius:10px;font-size:12px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:2px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs svg{width:20px;height:20px}
.fab{position:fixed;z-index:6;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(76px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;border-radius:18px;border:0;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#FFFFFF;font-size:28px;line-height:1;box-shadow:0 6px 18px rgb(0 0 0 / .18)}
.sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .4);display:grid;align-items:end}
.sheet .panel{background:var(--surface);border-radius:20px 20px 0 0;max-width:560px;width:100%;margin:0 auto;max-height:92%;overflow:auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sheet .ph{display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px}
.rec .t small b{font-weight:600}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><small>особистий</small>Гаманець Дар'ї</div>
    <div class="month">
      <button class="ibtn" id="mPrev" aria-label="Попередній місяць">‹</button>
      <span id="mLabel"></span>
      <button class="ibtn" id="mNext" aria-label="Наступний місяць">›</button>
    </div>
  </header>
  <div class="note" id="storeNote" hidden></div>
  <main id="view"></main>
</div>

<button class="fab" id="fab" aria-label="Додати операцію">+</button>

<nav class="tabs" aria-label="Розділи"><div>
  <button data-tab="overview" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-8 9 8v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Огляд</button>
  <button data-tab="ops"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Операції</button>
  <button data-tab="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 6"/></svg>Бюджет</button>
  <button data-tab="bills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Платежі</button>
</div></nav>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="ph"><h2 id="sheetTitle">Нова операція</h2><button class="ibtn" id="sheetClose" aria-label="Закрити">✕</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="xlsx.full.min.js" defer></script>
<script>
const EXP_CATS=["Продукти","Кафе","Транспорт","Житло","Комуналка","Здоров'я","Одяг","Розваги","Підписки","Подарунки","Освіта","Інше"];
const INC_CATS=["Зарплата","Підробіток","Подарунок","Повернення","Інше (дохід)"];
const CURS=["UAH","EUR","USD"];
const SYM={UAH:"₴",EUR:"€",USD:"$"};
const MONTHS=["січень","лютий","березень","квітень","травень","червень","липень","серпень","вересень","жовтень","листопад","грудень"];
const MONTHS_S=["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];
const DEFAULT_SETTINGS={rates:{EUR:48,USD:41.5},budgets:{},recurring:[]};

const state={tab:"overview",month:ym(new Date()),tx:[],settings:structuredClone(DEFAULT_SETTINGS),mode:"none",loaded:false};
let txCol=null,settingsRef=null;

function ym(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function today(){const d=new Date();return ym(d)+"-"+String(d.getDate()).padStart(2,"0")}
function shiftMonth(m,n){const [y,mo]=m.split("-").map(Number);return ym(new Date(y,mo-1+n,1))}
function monthLabel(m){const [y,mo]=m.split("-").map(Number);return MONTHS[mo-1]+" "+y}
const nf=new Intl.NumberFormat("uk-UA",{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat("uk-UA",{maximumFractionDigits:2});
function uah(n){return nf.format(Math.round(n))+" ₴"}
function money(a,c){return nf2.format(a)+" "+SYM[c]}
function toUAH(a,c){return c==="UAH"?a:a*(Number(state.settings.rates[c])||0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function catColor(cat){const all=[...EXP_CATS,...INC_CATS];const i=Math.max(0,all.indexOf(cat));return `var(--c${(i%8)+1})`}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
function uid(){return Math.random().toString(36).slice(2,10)}

/* ---------- storage ---------- */
const LS_KEY="hamanets-v1";
function lsLoad(){try{const r=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(r){state.tx=r.tx||[];state.settings={...structuredClone(DEFAULT_SETTINGS),...r.settings}}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify({tx:state.tx,settings:state.settings}))}catch(e){}}

let settingsQueue=Promise.resolve();
function saveSettings(){
  if(state.mode==="db"){
    const body=structuredClone(state.settings);
    settingsQueue=settingsQueue.then(()=>settingsRef.set(body)).catch(()=>toast("Не вдалося зберегти налаштування"));
  }else lsSave();
}
async function addTx(t){
  if(state.mode==="db"){
    try{await txCol.add(t)}catch(e){toast(e&&e.code==="quota_exceeded"?"Сховище заповнене: видаліть старі операції":"Не вдалося зберегти операцію")}
  }else{state.tx.push({...t,id:uid()});lsSave();render()}
}
async function delTx(id){
  if(state.mode==="db"){try{await txCol.doc(id).delete()}catch(e){toast("Не вдалося видалити")}}
  else{state.tx=state.tx.filter(t=>t.id!==id);lsSave();render()}
}

async function initStore(){
  state.mode="local";lsLoad();state.loaded=true;
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  render();
}

/* ---------- backup ---------- */
function daysSince(iso){if(!iso)return Infinity;return Math.floor((Date.now()-new Date(iso).getTime())/864e5)}
async function exportBackup(){
  const data=JSON.stringify({app:"hamanets",version:1,exported:new Date().toISOString(),tx:state.tx,settings:state.settings},null,1);
  const name="hamanets-"+today()+".json";
  const file=new File([data],name,{type:"application/json"});
  let ok=false;
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});ok=true}}
  catch(e){if(e&&e.name==="AbortError"){toast("Копію не збережено");return}}
  if(!ok){const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);ok=true}
  state.settings.lastBackup=new Date().toISOString();saveSettings();render();toast("Копію створено. Збережіть її у «Файли»");
}
async function importBackup(file){
  try{
    const d=JSON.parse(await file.text());
    if(!d||d.app!=="hamanets"||!Array.isArray(d.tx))throw new Error("bad");
    const ids=new Set(state.tx.map(t=>t.id));const keys=new Set(state.tx.map(t=>t.importKey).filter(Boolean));
    let added=0;for(const t of d.tx){if(ids.has(t.id)||(t.importKey&&keys.has(t.importKey)))continue;state.tx.push(t);added++}
    state.settings={...structuredClone(DEFAULT_SETTINGS),...state.settings,...d.settings};
    lsSave();render();toast(added?`Відновлено ${added} операцій`:"Усі операції з копії вже є в гаманці");
  }catch(e){toast("Це не файл резервної копії гаманця")}
}

/* ---------- derived ---------- */
function monthTx(m){return state.tx.filter(t=>(t.date||"").startsWith(m))}
function sums(m){
  let inc=0,exp=0;const byCat={};
  for(const t of monthTx(m)){const v=toUAH(Number(t.amount)||0,t.cur||"UAH");
    if(t.type==="inc")inc+=v;else{exp+=v;byCat[t.cat]=(byCat[t.cat]||0)+v}}
  return {inc,exp,bal:inc-exp,byCat};
}
function budgetStatus(m){
  const {byCat}=sums(m);const out=[];
  for(const [cat,lim] of Object.entries(state.settings.budgets||{})){
    if(!(lim>0))continue;const spent=byCat[cat]||0;const p=spent/lim;
    out.push({cat,lim,spent,p,level:p>=1?"bad":p>=.8?"warn":"ok"});
  }
  return out.sort((a,b)=>b.p-a.p);
}
function dueList(){
  const now=new Date();const m=ym(now);const d=now.getDate();
  const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  return (state.settings.recurring||[]).map(r=>{
    const day=Math.min(r.day,dim);const paid=(r.paid||[]).includes(m);
    return {...r,dueDay:day,paid,diff:day-d};
  }).sort((a,b)=>a.paid-b.paid||a.diff-b.diff);
}
function dueChip(r){
  if(r.paid)return `<span class="chip good">сплачено</span>`;
  if(r.diff<0)return `<span class="chip bad">прострочено ${-r.diff} дн.</span>`;
  if(r.diff===0)return `<span class="chip warn">сьогодні</span>`;
  if(r.diff<=3)return `<span class="chip warn">через ${r.diff} дн.</span>`;
  return `<span class="chip" style="background:var(--sunk);color:var(--muted)">${r.dueDay} числа</span>`;
}

/* ---------- charts ---------- */
function donut(byCat,total){
  const entries=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  if(!entries.length||total<=0)return "";
  const R=52,C=2*Math.PI*R;let off=0;
  const arcs=entries.map(([cat,v])=>{const len=v/total*C;const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${catColor(cat)}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s}).join("");
  const leg=entries.slice(0,7).map(([cat,v])=>`<div><i class="dot" style="background:${catColor(cat)}"></i><span>${esc(cat)}</span><b>${Math.round(v/total*100)}%</b></div>`).join("");
  return `<div class="donut"><svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="Витрати за категоріями">
    <circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--sunk)" stroke-width="20"/>${arcs}
    <text x="70" y="66" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Manrope,sans-serif">витрати</text>
    <text x="70" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fg)" font-family="Manrope,sans-serif">${esc(uah(total))}</text></svg>
    <div class="legend">${leg}</div></div>`;
}
function bars(){
  const months=[];for(let i=5;i>=0;i--)months.push(shiftMonth(state.month,-i));
  const data=months.map(m=>({m,...sums(m)}));
  const max=Math.max(1000,...data.map(d=>Math.max(d.exp,d.inc)));
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const s=[1,2,2.5,5,10].find(k=>k*p>=max);return s*p})();
  const W=340,H=170,L=44,B=24,T=10,cw=(W-L-6)/6,bw=Math.min(14,cw/3);
  const y=v=>T+(H-T-B)*(1-v/nice);
  let g="";for(let i=0;i<=2;i++){const v=nice*i/2;g+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v>=1000?nf.format(v/1000)+"k":nf.format(v)}</text>`}
  const b=data.map((d,i)=>{const cx=L+cw*i+cw/2;const [,mo]=d.m.split("-").map(Number);const cur=d.m===state.month;
    return `<rect x="${cx-bw-1}" y="${y(d.inc)}" width="${bw}" height="${H-B-y(d.inc)}" rx="3" fill="var(--good)" opacity="${cur?1:.55}"/>
    <rect x="${cx+1}" y="${y(d.exp)}" width="${bw}" height="${H-B-y(d.exp)}" rx="3" fill="var(--bad)" opacity="${cur?1:.55}"/>
    <text x="${cx}" y="${H-6}" text-anchor="middle" font-size="11" fill="${cur?"var(--fg)":"var(--muted)"}" font-weight="${cur?700:500}">${MONTHS_S[mo-1]}</text>`}).join("");
  return `<div class="bars"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Доходи і витрати за 6 місяців" font-family="Manrope,sans-serif">${g}${b}</svg></div>
  <div class="chips" style="font-size:13px;color:var(--muted)"><span><i class="dot" style="display:inline-block;background:var(--good)"></i> доходи</span><span><i class="dot" style="display:inline-block;background:var(--bad)"></i> витрати, ₴</span></div>`;
}

function guessCat(desc,bankCat,mcc,isInc){
  const txt=(bankCat||"")+" "+(desc||"");
  if(isInc){if(/зарплат|заробітн|salary|аванс/i.test(txt))return "Зарплата";if(/поверн|refund|кешбек|cashback/i.test(txt))return "Повернення";return "Інше (дохід)"}
  const m=parseInt(mcc,10);if(m)for(const [list,cat] of MCC)if(list.includes(m))return cat;
  for(const [re,cat] of KW)if(re.test(txt))return cat;
  return "Інше";
}
function parseNum(v){
  if(typeof v==="number")return v;
  let s=String(v??"").replace(/[\s  ]/g,"").replace(/[−–—]/g,"-");
  if(!s)return NaN;
  if(s.includes(",")&&s.includes("."))s=s.replace(/,/g,""); else s=s.replace(",",".");
  s=s.replace(/[^0-9.\-]/g,"");return parseFloat(s);
}
function parseDate(v){
  if(typeof v==="number"&&window.XLSX){const d=XLSX.SSF.parse_date_code(v);if(d)return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`}
  if(v instanceof Date&&!isNaN(v))return ym(v)+"-"+String(v.getDate()).padStart(2,"0");
  const s=String(v??"").trim();let m;
  if((m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`}
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function findCol(h,res,not){for(const re of res){const i=h.findIndex(x=>re.test(x)&&!(not&&not.test(x)));if(i>=0)return i}return -1}
function detect(rows){
  let hi=-1;
  for(let i=0;i<Math.min(rows.length,40);i++){const r=rows[i].map(c=>String(c).toLowerCase());if(r.some(c=>/дата|date/.test(c))&&r.some(c=>/сум|amount/.test(c))){hi=i;break}}
  if(hi<0)return null;
  const h=rows[hi].map(c=>String(c).toLowerCase().trim());
  const not=/коміс|кешбек|cashback|залишок|balance|курс|rate|fee/;
  const map={
    date:findCol(h,[/дата.*операц/,/дата/,/date/]),
    desc:findCol(h,[/деталі/,/опис/,/призначен/,/description|details|merchant/]),
    amount:findCol(h,[/сума.*валют.*карт/,/сума.*карт/,/сума.*рахун/,/^сума$/,/сума/,/amount/],not),
    cat:findCol(h,[/категор/,/category/]),
    mcc:findCol(h,[/^mcc/,/mcc/]),
  };
  let cur="UAH";const ah=h[map.amount]||"";
  const cm=ah.match(/\((uah|eur|usd)\)/i)||ah.match(/\b(uah|eur|usd|грн)\b/i);
  if(cm)cur=cm[1].toUpperCase()==="ГРН"?"UAH":cm[1].toUpperCase();
  else{const ci=findCol(h,[/валюта.*карт/,/валюта.*рахун/]);if(ci>=0){const v=String(rows[hi+1]?.[ci]||"").toUpperCase();if(CURS.includes(v))cur=v;else if(/ГРН|980/.test(v))cur="UAH"}}
  return {hi,header:rows[hi].map(String),map,cur};
}
async function readFile(file){
  const buf=await file.arrayBuffer();
  if(/\.csv$|\.txt$/i.test(file.name)||file.type==="text/csv"){
    let text=new TextDecoder("utf-8").decode(buf);
    if((text.match(/\uFFFD/g)||[]).length>3){try{text=new TextDecoder("windows-1251").decode(buf)}catch(e){}}
    text=text.replace(/^﻿/,"");
    return XLSX.read(text,{type:"string",raw:true});
  }
  return XLSX.read(buf,{type:"array"});
}
const imp={rows:[],det:null,items:[]};
function buildItems(){
  const {rows,det}=imp;const m=det.map;const keys=new Set(state.tx.map(t=>t.importKey).filter(Boolean));
  const out=[];
  for(let i=det.hi+1;i<rows.length;i++){
    const r=rows[i];const date=parseDate(r[m.date]);const a=parseNum(r[m.amount]);
    if(!date||!isFinite(a)||a===0)continue;
    const desc=m.desc>=0?String(r[m.desc]).trim():"";const bankCat=m.cat>=0?String(r[m.cat]):"";const mcc=m.mcc>=0?r[m.mcc]:"";
    const isInc=a>0;const key=[date,a.toFixed(2),det.cur,desc.slice(0,40)].join("|");
    const dup=keys.has(key);
    out.push({date,amount:Math.abs(a),type:isInc?"inc":"exp",cur:det.cur,note:desc.slice(0,80),cat:guessCat(desc,bankCat,mcc,isInc),importKey:key,dup,on:!dup&&!SKIP_RE.test(desc+" "+bankCat)});
  }
  imp.items=out.sort((a,b)=>b.date.localeCompare(a.date));
}
function impHelp(){return `<div class="note" style="display:grid;gap:8px">
  <b style="color:var(--fg)">Як отримати файл на iPhone</b>
  <ol class="steps"><li><b>Monobank:</b> картка → значок виписки → вибрати період → формат Excel або CSV → «Зберегти у Файли».</li>
  <li><b>Приват24:</b> картка → «Виписка» → період → завантажити Excel → «Зберегти у Файли».</li>
  <li>Тут натисніть «Вибрати файл» і знайдіть його в «Файлах».</li></ol>
  <span>Назви пунктів у застосунках банків можуть трохи відрізнятися після оновлень. Файл обробляється на Вашому телефоні: у гаманець потрапляють лише дата, сума, опис і категорія, номер картки не зберігається.</span></div>`}
function openImport(){
  if(!window.XLSX){toast("Модуль імпорту ще завантажується, спробуйте за кілька секунд");return}
  openSheet("Імпорт виписки",`<div style="display:grid;gap:12px">${impHelp()}
    <label class="btn" for="impFile" style="text-align:center">Вибрати файл</label>
    <input id="impFile" type="file" accept=".csv,.xls,.xlsx,.txt,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    <div id="impOut"></div></div>`,()=>{
      document.getElementById("impFile").onchange=async e=>{
        const f=e.target.files[0];if(!f)return;const out=document.getElementById("impOut");
        out.innerHTML=`<div class="note">Читаю «${esc(f.name)}»…</div>`;
        try{
          const wb=await readFile(f);let found=null,rows=null;
          for(const n of wb.SheetNames){const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""});const d=detect(r);if(d){found=d;rows=r;break}}
          if(!found){out.innerHTML=`<div class="note" style="color:var(--bad)">Не знайшла в файлі колонок «Дата» і «Сума». Перевірте, що це виписка операцій, а не PDF-довідка, і спробуйте формат Excel або CSV.</div>`;return}
          imp.rows=rows;imp.det=found;buildItems();renderImport();
        }catch(err){out.innerHTML=`<div class="note" style="color:var(--bad)">Файл не вдалося прочитати. Підходять формати .xlsx, .xls і .csv.</div>`}
      };
    });
}
function renderImport(){
  const out=document.getElementById("impOut");const {det,items}=imp;const h=det.header;
  const opt=(sel,allowNone)=>(allowNone?`<option value="-1" ${sel<0?"selected":""}>— немає —</option>`:"")+h.map((c,i)=>`<option value="${i}" ${i===sel?"selected":""}>${esc(c||"колонка "+(i+1))}</option>`).join("");
  const on=items.filter(x=>x.on);const dups=items.filter(x=>x.dup).length;
  out.innerHTML=`<div style="display:grid;gap:12px">
    <details><summary style="cursor:pointer;font-weight:600">Колонки файлу (перевірте, якщо щось не так)</summary>
    <div class="grid2" style="margin-top:10px">
      <label class="f" for="mDate">Дата<select id="mDate" data-map="date">${opt(det.map.date)}</select></label>
      <label class="f" for="mAmt">Сума<select id="mAmt" data-map="amount">${opt(det.map.amount)}</select></label>
      <label class="f" for="mDesc">Опис<select id="mDesc" data-map="desc">${opt(det.map.desc,1)}</select></label>
      <label class="f" for="mCat">Категорія банку<select id="mCat" data-map="cat">${opt(det.map.cat,1)}</select></label>
      <label class="f" for="mCur">Валюта рахунку<select id="mCur">${curOptions(det.cur)}</select></label>
    </div></details>
    <div class="note">Знайдено ${items.length} операцій${dups?`, з них ${dups} вже є в гаманці`:""}. Перекази між своїми рахунками я зняла з позначки, щоб вони не рахувалися як витрати. Перевірте категорії.</div>
    <div class="imp-list">${items.map((x,i)=>`<div class="imp-row ${x.dup?"dup":""}">
      <input type="checkbox" id="ic${i}" data-i="${i}" ${x.on?"checked":""} ${x.dup?"disabled":""} aria-label="Імпортувати">
      <div style="min-width:0"><label for="ic${i}" style="font-weight:600;overflow-wrap:anywhere">${esc(x.note||"Без опису")}</label><br><small>${x.date.split("-").reverse().join(".")}${x.dup?" · вже є":""}</small><br>
      <select id="icat${i}" data-ci="${i}" aria-label="Категорія">${catOptions(x.type,x.cat)}</select></div>
      <div class="amt ${x.type==="inc"?"inc":""}">${x.type==="inc"?"+":"−"}${money(x.amount,x.cur)}</div></div>`).join("")||`<div class="empty">Нових операцій немає.</div>`}</div>
    <div class="prog" id="impProg" hidden><i></i></div>
    <button class="btn" id="impGo" ${on.length?"":"disabled"}>Додати ${on.length} операцій</button></div>`;
  out.querySelectorAll("[data-map]").forEach(s=>s.onchange=()=>{det.map[s.dataset.map]=+s.value;buildItems();renderImport()});
  document.getElementById("mCur").onchange=e=>{det.cur=e.target.value;buildItems();renderImport()};
  out.querySelectorAll("[data-i]").forEach(c=>c.onchange=()=>{items[+c.dataset.i].on=c.checked;const n=items.filter(x=>x.on).length;const b=document.getElementById("impGo");b.textContent=`Додати ${n} операцій`;b.disabled=!n});
  out.querySelectorAll("[data-ci]").forEach(s=>s.onchange=()=>{items[+s.dataset.ci].cat=s.value});
  document.getElementById("impGo").onclick=runImport;
}
async function runImport(){
  const list=imp.items.filter(x=>x.on&&!x.dup);if(!list.length)return;
  const btn=document.getElementById("impGo");btn.disabled=true;const pr=document.getElementById("impProg");pr.hidden=false;
  const c=new Date().toISOString();let ok=0;
  const docs=list.map(x=>({type:x.type,amount:x.amount,cur:x.cur,cat:x.cat,note:x.note,date:x.date,created:c,src:"import",importKey:x.importKey}));
  if(state.mode==="db"){
    for(const d of docs){
      let tries=0;
      while(true){try{await txCol.add(d);ok++;break}catch(e){
        if(e&&e.code==="quota_exceeded"){toast("Сховище заповнене: видаліть старі операції");tries=9}
        if(++tries>2)break;await new Promise(r=>setTimeout(r,1500*tries))}}
      if(tries>8)break;
      pr.firstElementChild.style.width=(ok/docs.length*100)+"%";btn.textContent=`Додаю… ${ok} з ${docs.length}`;
    }
  }else{for(const d of docs)state.tx.push({...d,id:uid()});ok=docs.length;lsSave()}
  closeSheet();state.month=docs[0].date.slice(0,7);state.tab="ops";render();
  toast(ok===docs.length?`Додано ${ok} операцій`:`Додано ${ok} з ${docs.length}. Решту спробуйте ще раз: дублікати пропустяться`);
}

/* ---------- events ---------- */
document.getElementById("fab").onclick=openTxForm;
document.getElementById("mPrev").onclick=()=>{state.month=shiftMonth(state.month,-1);render()};
document.getElementById("mNext").onclick=()=>{state.month=shiftMonth(state.month,1);render()};
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();window.scrollTo(0,0)});

document.getElementById("view").addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.id==="seed")return seedExamples();
  if(t.dataset.import)return openImport();
  if(t.id==="bkSave")return exportBackup();
  if(t.dataset.goto){state.tab=t.dataset.goto;render();window.scrollTo(0,0);return}
  if(t.id==="addRec")return openRecForm();
  if(t.dataset.del){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Точно видалити?";setTimeout(()=>{t.classList.remove("armed");t.textContent="Видалити"},3000);return}
    await delTx(t.dataset.del);toast("Операцію видалено");return}
  if(t.dataset.delrec){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Точно видалити?";setTimeout(()=>{t.classList.remove("armed");t.textContent="Видалити"},3000);return}
    state.settings.recurring=state.settings.recurring.filter(r=>r.id!==t.dataset.delrec);saveSettings();render();return}
  if(t.dataset.pay){const r=state.settings.recurring.find(x=>x.id===t.dataset.pay);if(!r)return;const m=ym(new Date());
    r.paid=[...new Set([...(r.paid||[]).filter(p=>p>=shiftMonth(m,-12)),m])];saveSettings();
    await addTx({type:"exp",amount:Number(r.amount),cur:r.cur,cat:r.cat,note:r.name,date:today(),created:new Date().toISOString()});
    render();toast("Записано як витрату")}
});
let limTimer=null;
document.getElementById("view").addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="bkFile"&&el.files[0]){importBackup(el.files[0]);el.value="";return}
  if(el.dataset.lim!==undefined){const v=parseFloat(el.value);const b={...(state.settings.budgets||{})};if(v>0)b[el.dataset.lim]=v;else delete b[el.dataset.lim];state.settings.budgets=b;saveSettings();render();toast("Ліміт збережено")}
  if(el.dataset.rate){const v=parseFloat(el.value);if(v>0){state.settings.rates={...state.settings.rates,[el.dataset.rate]:v};saveSettings();render();toast("Курс оновлено")}}
});

async function seedExamples(){
  const m=state.month;const d=n=>m+"-"+String(n).padStart(2,"0");const c=new Date().toISOString();
  const ex=[["inc",32000,"UAH","Зарплата","Зарплата (приклад)",1],["exp",1450,"UAH","Продукти","Сільпо (приклад)",2],["exp",380,"UAH","Кафе","Кава з колегами (приклад)",3],
    ["exp",250,"EUR","Житло","Оренда (приклад)",5],["exp",620,"UAH","Транспорт","Таксі (приклад)",6],["exp",12.99,"USD","Підписки","Підписка (приклад)",7]];
  for(const [type,amount,cur,cat,note,day] of ex) await addTx({type,amount,cur,cat,note,date:d(day),created:c,example:true});
  toast("Додано приклади. Їх можна видалити");
}
