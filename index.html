<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Гаманець Дар'ї</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Гаманець">
<meta name="theme-color" content="#6E33AE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
/* Layout: одна колонка-«гаманець» до 560px, вкладки внизу, кнопка додавання над ними */
:root{
  --bg:#F8F3FC; --surface:#FFFFFF; --sunk:#EFE4F8; --fg:#24132F; --muted:#6E5A7C; --line:#E2D2EE;
  --accent:#7A3DB8; --accent-ink:#FFFFFF; --accent-soft:#EADCF8; --pink:#D9488A; --lilac:#B794E0;
  --hero-a:#6E33AE; --hero-b:#D9488A;
  --good:#2B7A4B; --warn:#A8690F; --bad:#B23A30; --warn-soft:#F6E7CC; --bad-soft:#F5D9D5; --good-soft:#D8EEDF;
  --c1:#7A3DB8; --c2:#D9488A; --c3:#3D5A99; --c4:#C27C1E; --c5:#5E8C2E; --c6:#A77BDB; --c7:#2C8C9E; --c8:#8A7F92;
  --f-display:"Unbounded", "Manrope", system-ui, sans-serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#140D1B; --surface:#1E1528; --sunk:#291D36; --fg:#F1E8F8; --muted:#AE9CBE; --line:#3A2A4A;
  --accent:#BE92F2; --accent-ink:#1A0F24; --accent-soft:#33224A; --pink:#F27DB2; --lilac:#9C7BC6;
  --hero-a:#5B2A93; --hero-b:#B23A73;
  --good:#5BC284; --warn:#E3A746; --bad:#EE7A6E; --warn-soft:#3A2E17; --bad-soft:#3D2220; --good-soft:#1B3526;
  --c1:#BE92F2; --c2:#F27DB2; --c3:#7C9BE0; --c4:#E3A746; --c5:#9CC86A; --c6:#D6B8F7; --c7:#5FC3D3; --c8:#B8ABC4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#140D1B; --surface:#1E1528; --sunk:#291D36; --fg:#F1E8F8; --muted:#AE9CBE; --line:#3A2A4A;
  --accent:#BE92F2; --accent-ink:#1A0F24; --accent-soft:#33224A; --pink:#F27DB2; --lilac:#9C7BC6;
  --hero-a:#5B2A93; --hero-b:#B23A73;
  --good:#5BC284; --warn:#E3A746; --bad:#EE7A6E; --warn-soft:#3A2E17; --bad-soft:#3D2220; --good-soft:#1B3526;
  --c1:#BE92F2; --c2:#F27DB2; --c3:#7C9BE0; --c4:#E3A746; --c5:#9CC86A; --c6:#D6B8F7; --c7:#5FC3D3; --c8:#B8ABC4;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:120px;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.1;display:grid}
.brand small{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--pink);letter-spacing:.04em}
.month{display:flex;align-items:center;gap:4px}
.month span{min-width:118px;text-align:center;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
.ibtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ibtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:8px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.hero{background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 100%);color:#FFFFFF;border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgb(255 255 255 / .1)}
.hero>*{position:relative}
.hero .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,8vw,38px);line-height:1.1}
.hero .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero .row div{display:grid;gap:2px}
.hero .row b{font-size:17px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:600;border-radius:999px;padding:5px 10px}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--good-soft);color:var(--good)}
.list{display:grid}
.item{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.acc{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.acc:first-child{border-top:0}.acc.tot{font-weight:700}.acc .del{color:var(--accent);font-weight:700}
.chips button[data-accf]{border:0;cursor:pointer;background:var(--sunk);color:var(--fg);padding:8px 14px}
.chips button[data-accf][aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sw{position:relative;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sw .item{border-top:0;position:relative;background:var(--surface);touch-action:pan-y;transition:transform .25s ease;will-change:transform}
.sw.drag .item{transition:none}
.sw+.sw{border-top:1px solid var(--line)}
.sw-act{position:absolute;inset:1px 0 1px 50%;display:flex;justify-content:flex-end;background:var(--bad);border-radius:12px}
.sw-left{position:absolute;inset:1px 50% 1px 0;display:flex;justify-content:flex-start;background:var(--accent);border-radius:12px}
.sw-tr{border:0;background:none;color:var(--accent-ink);font-weight:700;font-size:14px;min-width:120px;padding:0 16px}
.item.is-tr{opacity:.62}.item.is-tr .amt{color:var(--muted);font-weight:600}
.trq{color:var(--warn);font-weight:700}
.imp-row select.tsel{margin-right:6px;max-width:130px}
.sw-del{border:0;background:none;color:#fff;font-weight:700;font-size:14px;min-width:96px;padding:0 16px}
.undo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:31;background:var(--fg);color:var(--bg);padding:8px 8px 8px 16px;border-radius:14px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:12px;max-width:92vw}
.undo button{border:0;border-radius:10px;padding:8px 12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%}
.item .t{min-width:0}
.item .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.item .t small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.amt{font-weight:700;text-align:right;white-space:nowrap}
.amt.inc{color:var(--good)}
.amt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.del{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 0}
.del.armed{color:var(--bad);font-weight:700}
.donut{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center}
@media (max-width:380px){.donut{grid-template-columns:1fr;justify-items:center}}
.legend{display:grid;gap:6px;font-size:13px;min-width:0;width:100%}
.legend div{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center}
.bars svg{width:100%;height:auto;display:block}
.bud{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.bud:first-child{border-top:0}
.bud .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bud .h b{font-weight:600}
.bud .h span{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.lim{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.lim input{width:110px}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);padding:0}
.imp-card{background:var(--accent-soft);border:0}
.imp-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.imp-row:first-child{border-top:0}
.imp-row.dup{opacity:.5}
.imp-row select{font-size:14px;padding:5px 8px;margin-top:4px}
.imp-row small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.imp-list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:0 12px}
.steps{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));width:0}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.empty{text-align:center;color:var(--muted);padding:20px 8px;display:grid;gap:10px;justify-items:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:none;padding:8px 2px;border-radius:10px;font-size:12px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:2px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs svg{width:20px;height:20px}
.fab{position:fixed;z-index:6;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(76px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;border-radius:18px;border:0;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#FFFFFF;font-size:28px;line-height:1;box-shadow:0 6px 18px rgb(0 0 0 / .18)}
.sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .4);display:grid;align-items:end}
.sheet .panel{background:var(--surface);border-radius:20px 20px 0 0;max-width:560px;width:100%;margin:0 auto;max-height:92%;overflow:auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sheet .ph{display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px}
.rec .t small b{font-weight:600}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><small>особистий</small>Гаманець Дар'ї</div>
    <div class="month">
      <button class="ibtn" id="mPrev" aria-label="Попередній місяць">‹</button>
      <span id="mLabel"></span>
      <button class="ibtn" id="mNext" aria-label="Наступний місяць">›</button>
    </div>
  </header>
  <div class="note" id="storeNote" hidden></div>
  <main id="view"></main>
</div>

<button class="fab" id="fab" aria-label="Додати операцію">+</button>

<nav class="tabs" aria-label="Розділи"><div>
  <button data-tab="overview" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-8 9 8v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Огляд</button>
  <button data-tab="ops"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Операції</button>
  <button data-tab="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 6"/></svg>Бюджет</button>
  <button data-tab="bills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Платежі</button>
</div></nav>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="ph"><h2 id="sheetTitle">Нова операція</h2><button class="ibtn" id="sheetClose" aria-label="Закрити">✕</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="undo" id="undo" role="status" hidden><span id="undoText">Операцію видалено</span><button id="undoBtn">Скасувати</button></div>

<script src="xlsx.full.min.js" defer></script>
<script>
const EXP_CATS=["Продукти","Кафе","Транспорт","Житло","Комуналка","Здоров'я","Одяг","Розваги","Підписки","Подарунки","Освіта","Перекази людям","Комісії банку","Інше"];
const TR_CAT="Переказ";
const INC_CATS=["Зарплата","Підробіток","Подарунок","Повернення","Інше (дохід)"];
const CURS=["UAH","EUR","USD"];
const SYM={UAH:"₴",EUR:"€",USD:"$"};
const MONTHS=["січень","лютий","березень","квітень","травень","червень","липень","серпень","вересень","жовтень","листопад","грудень"];
const MONTHS_S=["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];
const DEFAULT_SETTINGS={rates:{EUR:48,USD:41.5},budgets:{},recurring:[]};
const DEFAULT_ACCOUNTS=[{id:"cash",name:"Готівка",short:"Готівка",start:0},{id:"raif",name:"Картка Райффайзен",short:"Картка",start:0}];

const state={tab:"overview",month:ym(new Date()),tx:[],settings:structuredClone(DEFAULT_SETTINGS),mode:"none",loaded:false};
let txCol=null,settingsRef=null;

function ym(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function today(){const d=new Date();return ym(d)+"-"+String(d.getDate()).padStart(2,"0")}
function shiftMonth(m,n){const [y,mo]=m.split("-").map(Number);return ym(new Date(y,mo-1+n,1))}
function monthLabel(m){const [y,mo]=m.split("-").map(Number);return MONTHS[mo-1]+" "+y}
const nf=new Intl.NumberFormat("uk-UA",{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat("uk-UA",{maximumFractionDigits:2});
function uah(n){return nf.format(Math.round(n))+" ₴"}
function money(a,c){return nf2.format(a)+" "+SYM[c]}
function toUAH(a,c){return c==="UAH"?a:a*(Number(state.settings.rates[c])||0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function catColor(cat){if(cat===TR_CAT)return "var(--muted)";const all=[...EXP_CATS,...INC_CATS];const i=Math.max(0,all.indexOf(cat));return `var(--c${(i%8)+1})`}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
function uid(){return Math.random().toString(36).slice(2,10)}

/* ---------- storage ---------- */
const LS_KEY="hamanets-v1";
function lsLoad(){try{const r=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(r){state.tx=r.tx||[];state.settings={...structuredClone(DEFAULT_SETTINGS),...r.settings}}}catch(e){}migrateAccounts()}
function migrateAccounts(){const st=state.settings;if(!Array.isArray(st.accounts)||!st.accounts.length){st.accounts=structuredClone(DEFAULT_ACCOUNTS);st.accSetup=false}
  let ch=false;for(const t of state.tx)if(!t.acc){t.acc=t.importKey?"raif":"cash";ch=true}
  if(!st._fixOut){st._fixOut=1;ch=true;for(const t of state.tx)if(t.type==="tr"&&!t.to&&t.dir==="out"&&t.importKey&&!t.manualTr&&!SKIP_RE.test(t.note||"")){t.type="exp";t.cat=(t.prevCat&&t.prevCat!=="Інше")?t.prevCat:"Перекази людям";delete t.dir;delete t.prevCat}}if(ch||!st._migr){st._migr=1;lsSave()}}
const ACC=()=>state.settings.accounts||DEFAULT_ACCOUNTS;
const accName=id=>(ACC().find(a=>a.id===id)||{}).short||"";
const accById=id=>ACC().find(a=>a.id===id);
function movement(id){let m=0;for(const t of state.tx){const v=toUAH(Number(t.amount)||0,t.cur||"UAH");
    if(t.type==="tr"&&t.to){if(t.acc===id)m-=v;if(t.to===id)m+=v;continue}
    if(t.acc!==id)continue;
    if(t.type==="inc")m+=v;else if(t.type==="exp")m-=v;else if(t.type==="tr")m+=t.dir==="in"?v:-v}return m}
const accBal=id=>(Number((accById(id)||{}).start)||0)+movement(id);
function accOptions(sel){return ACC().map(a=>`<option value="${a.id}" ${a.id===sel?"selected":""}>${esc(a.name)}</option>`).join("")}
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify({tx:state.tx,settings:state.settings}))}catch(e){}}

let settingsQueue=Promise.resolve();
function saveSettings(){
  if(state.mode==="db"){
    const body=structuredClone(state.settings);
    settingsQueue=settingsQueue.then(()=>settingsRef.set(body)).catch(()=>toast("Не вдалося зберегти налаштування"));
  }else lsSave();
}
async function addTx(t){if(!t.acc)t.acc=state.settings.lastAcc||"cash";
  if(state.mode==="db"){
    try{await txCol.add(t)}catch(e){toast(e&&e.code==="quota_exceeded"?"Сховище заповнене: видаліть старі операції":"Не вдалося зберегти операцію")}
  }else{state.tx.push({...t,id:uid()});lsSave();render()}
}
function dupExtras(){const g={};for(const t of state.tx){if(!t.importKey)continue;(g[t.importKey]=g[t.importKey]||[]).push(t)}
  const extra=[];for(const k in g){const a=g[k];if(a.length<2)continue;a.sort((x,y)=>(x.created||"").localeCompare(y.created||"")||String(x.id).localeCompare(String(y.id)));extra.push(...a.slice(1))}return extra}
const dayDiff=(a,b)=>Math.abs((new Date(a)-new Date(b))/864e5);
function sameOp(a,b){return a.type===b.type&&(a.cur||"UAH")===(b.cur||"UAH")&&Math.abs(Number(a.amount)-Number(b.amount))<0.005&&dayDiff(a.date,b.date)<=1}
function dupPairs(){const extra=new Set(dupExtras().map(t=>t.id));const imps=state.tx.filter(t=>t.importKey&&!extra.has(t.id));const used=new Set();const pairs=[];
  for(const m of state.tx.filter(t=>!t.importKey&&!t.example)){let best=null;for(const i of imps){if(used.has(i.id)||!sameOp(m,i))continue;if(!best||dayDiff(m.date,i.date)<dayDiff(m.date,best.date))best=i}
    if(best){used.add(best.id);pairs.push({m,i:best})}}return pairs}
const dupCount=()=>dupExtras().length+dupPairs().length;
function dedupe(){const pairs=dupPairs(),ex=dupExtras();if(!pairs.length&&!ex.length)return;
  const fmtD=d=>d.split("-").reverse().slice(0,2).join(".");
  openSheet("Дублікати",`<div class="note">Залишаю Ваш ручний запис (з Вашою категорією й коментарем), а копію з виписки прибираю. Наступні імпорти вже знатимуть, що ця операція є. Зніміть галочку, якщо це насправді дві різні покупки.</div>
    ${pairs.length?`<div class="imp-list">${pairs.map((p,k)=>`<div class="imp-row"><input type="checkbox" id="dp${k}" data-dp="${k}" checked aria-label="Прибрати копію">
      <div style="min-width:0"><label for="dp${k}" style="font-weight:600;overflow-wrap:anywhere">${esc(p.m.note||p.m.cat)}</label><br><small>вручну ${fmtD(p.m.date)} · з виписки ${fmtD(p.i.date)}: ${esc((p.i.note||"").slice(0,50))}</small></div>
      <div class="amt">${p.m.type==="inc"?"+":"−"}${money(Number(p.m.amount),p.m.cur||"UAH")}</div></div>`).join("")}</div>`:""}
    ${ex.length?`<div class="note">Ще ${ex.length} повторів з двох імпортів однієї виписки буде прибрано.</div>`:""}
    <button class="btn" id="dpGo">Прибрати дублікати</button>`,()=>{
      document.getElementById("dpGo").onclick=async()=>{const sel=pairs.filter((p,k)=>document.getElementById("dp"+k)?.checked);
        const delIds=new Set([...sel.map(p=>p.i.id),...ex.map(t=>t.id)]);
        for(const p of sel)p.m.importKey=p.i.importKey;
        if(state.mode==="db"){for(const p of sel){try{await txCol.doc(p.m.id).update({importKey:p.i.importKey})}catch(e){}}for(const id of delIds){try{await txCol.doc(id).delete()}catch(e){}}}
        else{state.tx=state.tx.filter(t=>!delIds.has(t.id));lsSave()}
        closeSheet();render();toast(`Прибрано дублікатів: ${delIds.size}`)}})}
async function delTx(id){
  if(state.mode==="db"){try{await txCol.doc(id).delete()}catch(e){toast("Не вдалося видалити")}}
  else{state.tx=state.tx.filter(t=>t.id!==id);lsSave();render()}
}

/* ---------- backup ---------- */
function daysSince(iso){if(!iso)return Infinity;return Math.floor((Date.now()-new Date(iso).getTime())/864e5)}
async function exportBackup(){
  const data=JSON.stringify({app:"hamanets",version:1,exported:new Date().toISOString(),tx:state.tx,settings:state.settings},null,1);
  const name="hamanets-"+today()+".json";
  const file=new File([data],name,{type:"application/json"});
  let ok=false;
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});ok=true}}
  catch(e){if(e&&e.name==="AbortError"){toast("Копію не збережено");return}}
  if(!ok){const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);ok=true}
  state.settings.lastBackup=new Date().toISOString();saveSettings();render();toast("Копію створено. Збережіть її у «Файли»");
}
async function importBackup(file){
  try{
    const d=JSON.parse(await file.text());
    if(!d||d.app!=="hamanets"||!Array.isArray(d.tx))throw new Error("bad");
    const ids=new Set(state.tx.map(t=>t.id));const keys=new Set(state.tx.map(t=>t.importKey).filter(Boolean));
    let added=0;for(const t of d.tx){if(ids.has(t.id)||(t.importKey&&keys.has(t.importKey)))continue;state.tx.push(t);added++}
    state.settings={...structuredClone(DEFAULT_SETTINGS),...state.settings,...d.settings};
    lsSave();render();toast(added?`Відновлено ${added} операцій`:"Усі операції з копії вже є в гаманці");
  }catch(e){toast("Це не файл резервної копії гаманця")}
}

/* ---------- derived ---------- */
function monthTx(m){return state.tx.filter(t=>(t.date||"").startsWith(m))}
function sums(m){
  let inc=0,exp=0;const byCat={};
  for(const t of monthTx(m)){const v=toUAH(Number(t.amount)||0,t.cur||"UAH");
    if(t.type==="tr")continue;if(t.type==="inc")inc+=v;else{exp+=v;byCat[t.cat]=(byCat[t.cat]||0)+v}}
  return {inc,exp,bal:inc-exp,byCat};
}
function budgetStatus(m){
  const {byCat}=sums(m);const out=[];
  for(const [cat,lim] of Object.entries(state.settings.budgets||{})){
    if(!(lim>0))continue;const spent=byCat[cat]||0;const p=spent/lim;
    out.push({cat,lim,spent,p,level:p>=1?"bad":p>=.8?"warn":"ok"});
  }
  return out.sort((a,b)=>b.p-a.p);
}
function dueList(){
  const now=new Date();const m=ym(now);const d=now.getDate();
  const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  return (state.settings.recurring||[]).map(r=>{
    const day=Math.min(r.day,dim);const paid=(r.paid||[]).includes(m);
    return {...r,dueDay:day,paid,diff:day-d};
  }).sort((a,b)=>a.paid-b.paid||a.diff-b.diff);
}
function dueChip(r){
  if(r.paid)return `<span class="chip good">сплачено</span>`;
  if(r.diff<0)return `<span class="chip bad">прострочено ${-r.diff} дн.</span>`;
  if(r.diff===0)return `<span class="chip warn">сьогодні</span>`;
  if(r.diff<=3)return `<span class="chip warn">через ${r.diff} дн.</span>`;
  return `<span class="chip" style="background:var(--sunk);color:var(--muted)">${r.dueDay} числа</span>`;
}

/* ---------- charts ---------- */
function donut(byCat,total){
  const entries=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  if(!entries.length||total<=0)return "";
  const R=52,C=2*Math.PI*R;let off=0;
  const arcs=entries.map(([cat,v])=>{const len=v/total*C;const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${catColor(cat)}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s}).join("");
  const leg=entries.slice(0,7).map(([cat,v])=>`<div><i class="dot" style="background:${catColor(cat)}"></i><span>${esc(cat)}</span><b>${Math.round(v/total*100)}%</b></div>`).join("");
  return `<div class="donut"><svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="Витрати за категоріями">
    <circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--sunk)" stroke-width="20"/>${arcs}
    <text x="70" y="66" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Manrope,sans-serif">витрати</text>
    <text x="70" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fg)" font-family="Manrope,sans-serif">${esc(uah(total))}</text></svg>
    <div class="legend">${leg}</div></div>`;
}
function bars(){
  const months=[];for(let i=5;i>=0;i--)months.push(shiftMonth(state.month,-i));
  const data=months.map(m=>({m,...sums(m)}));
  const max=Math.max(1000,...data.map(d=>Math.max(d.exp,d.inc)));
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const s=[1,2,2.5,5,10].find(k=>k*p>=max);return s*p})();
  const W=340,H=170,L=44,B=24,T=10,cw=(W-L-6)/6,bw=Math.min(14,cw/3);
  const y=v=>T+(H-T-B)*(1-v/nice);
  let g="";for(let i=0;i<=2;i++){const v=nice*i/2;g+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v>=1000?nf.format(v/1000)+"k":nf.format(v)}</text>`}
  const b=data.map((d,i)=>{const cx=L+cw*i+cw/2;const [,mo]=d.m.split("-").map(Number);const cur=d.m===state.month;
    return `<rect x="${cx-bw-1}" y="${y(d.inc)}" width="${bw}" height="${H-B-y(d.inc)}" rx="3" fill="var(--good)" opacity="${cur?1:.55}"/>
    <rect x="${cx+1}" y="${y(d.exp)}" width="${bw}" height="${H-B-y(d.exp)}" rx="3" fill="var(--bad)" opacity="${cur?1:.55}"/>
    <text x="${cx}" y="${H-6}" text-anchor="middle" font-size="11" fill="${cur?"var(--fg)":"var(--muted)"}" font-weight="${cur?700:500}">${MONTHS_S[mo-1]}</text>`}).join("");
  return `<div class="bars"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Доходи і витрати за 6 місяців" font-family="Manrope,sans-serif">${g}${b}</svg></div>
  <div class="chips" style="font-size:13px;color:var(--muted)"><span><i class="dot" style="display:inline-block;background:var(--good)"></i> доходи</span><span><i class="dot" style="display:inline-block;background:var(--bad)"></i> витрати, ₴</span></div>`;
}

    <div class="amt ${inc?"inc":""}">${tr&&t.to?"⇄ ":tr?(t.dir==="in"?"↓ ":"↑ "):inc?"+":"−"}${money(Number(t.amount),cur)}${conv}</div></div></div>`;
}
function emptyBlock(){
  return `<div class="empty"><div>Тут з'являться Ваші доходи й витрати. Натисніть <b>+</b>, щоб додати операцію, або завантажте виписку з банку.</div>

}
function vOverview(){

  ${(bs.length||due.length||bkWarn)?`<div class="card"><h2>Зверніть увагу</h2><div class="chips">

    ${due.map(r=>`<span class="chip ${r.diff<0?"bad":"warn"}">${esc(r.name)}: ${r.diff<0?"прострочено":r.diff===0?"сьогодні":"через "+r.diff+" дн."}</span>`).join("")}
  </div></div>`:""}
  <div class="card"><h2>Куди йдуть гроші</h2>${s.exp>0?donut(s.byCat,s.exp):`<div class="note">У цьому місяці витрат ще немає.</div>`}</div>
  <div class="card"><h2>Півроку в динаміці</h2>${bars()}</div>

function accountsCard(){const st=state.settings;
  if(st.accSetup===false)return `<div class="card"><h2>Рахунки</h2><div class="note">Вкажіть, скільки грошей у Вас зараз, і гаманець показуватиме реальні залишки по готівці й картці.</div><button class="btn" id="accSetup">Вказати залишки</button></div>`;

function setupSheet(){openSheet("Скільки зараз є?",`<div class="note">Подивіться в гаманець і в застосунок банку та впишіть поточні суми. Усі вже внесені операції гаманець врахує сам.</div><div class="note">Порада: спершу імпортуйте свіжу виписку з картки, а потім вказуйте залишки. Так вони зійдуться точно.</div>
  ${ACC().map(a=>`<label class="f" for="st_${a.id}">${esc(a.name)}, ₴<input id="st_${a.id}" type="number" inputmode="decimal" step="0.01" value="${Math.round(accBal(a.id)*100)/100}"></label>`).join("")}
  <button class="btn" id="stGo">Зберегти</button>`,()=>{document.getElementById("stGo").onclick=()=>{for(const a of ACC()){const v=parseFloat(document.getElementById("st_"+a.id).value);if(isFinite(v))a.start=Math.round((v-movement(a.id))*100)/100}

function reconSheet(id){const a=accById(id);const b=accBal(id);openSheet("Звірити: "+a.name,`<div class="note">У гаманці зараз <b>${uah(b)}</b>. Скільки насправді?</div>

function moveSheet(){const A=ACC();openSheet("Переказ між рахунками",`<div class="grid2"><label class="f" for="mvF">Звідки<select id="mvF">${accOptions(A[0].id)}</select></label><label class="f" for="mvT">Куди<select id="mvT">${accOptions(A[1]?A[1].id:A[0].id)}</select></label></div>

function vOps(){
  const af=state.accFilter||"all";

  const dn=dupCount();const tn=transferCandidates().length;
  const imp=`<div class="card imp-card"><div class="top"><div><h2>Виписка з банку</h2><small style="color:var(--muted)">PDF, Excel або CSV з будь-якого банку</small></div><button class="btn sm" data-import="1">Імпорт</button></div>
    ${dn?`<div class="top" style="border-top:1px solid var(--line);padding-top:12px"><small style="color:var(--muted)">Схоже на дублі: ${dn}</small><button class="btn sm ghost" id="dedupe">Прибрати дублікати</button></div>`:""}
    ${tn?`<div class="top" style="border-top:1px solid var(--line);padding-top:12px"><small style="color:var(--muted)">Схоже на перекази: ${tn}</small><button class="btn sm ghost" id="findTr">Знайти перекази</button></div>`:""}</div>`;

function vOpsList(list){

    return `<div class="card"><div class="top"><h2>${Number(dd)} ${MONTHS_S[Number(m)-1]}</h2><span class="lbl">${net<0?"−":"+"}${uah(Math.abs(net))}</span></div><div class="list">${ts.map(txRow).join("")}</div></div>`}).join("");

function vBudget(){
  const {byCat}=sums(state.month);const b=state.settings.budgets||{};
  const rows=EXP_CATS.map(cat=>{const lim=Number(b[cat])||0;const spent=byCat[cat]||0;const p=lim?spent/lim:0;const lv=p>=1?"bad":p>=.8?"warn":"";
    return `<div class="bud"><div class="h"><b><i class="dot" style="display:inline-block;background:${catColor(cat)}"></i> ${esc(cat)}</b><span>${uah(spent)}${lim?" з "+uah(lim):""}</span></div>
      ${lim?`<div class="bar"><i class="${lv}" style="width:${Math.min(100,p*100)}%"></i></div>`:""}

function guessCat(desc,bankCat,mcc,isInc){

function parseNum(v){
  if(typeof v==="number")return v;
  let s=String(v??"").replace(/[\s  ]/g,"").replace(/[−–—]/g,"-");
  if(!s)return NaN;
  if(s.includes(",")&&s.includes(".")){if(s.lastIndexOf(",")>s.lastIndexOf("."))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/,/g,"")}else s=s.replace(",",".");

}
function parseDate(v){

  if(v instanceof Date&&!isNaN(v))return ym(v)+"-"+String(v.getDate()).padStart(2,"0");
  const s=String(v??"").trim();let m;
  if((m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`}
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}

function detect(rows){
  let hi=-1;
  for(let i=0;i<Math.min(rows.length,40);i++){const r=rows[i].map(c=>String(c).toLowerCase());if(r.some(c=>/дата|date/.test(c))&&r.some(c=>/сум|amount/.test(c))){hi=i;break}}

  const h=rows[hi].map(c=>String(c).toLowerCase().trim());

  const map={

    credit:findCol(h,[/кредит/,/зарахув/,/надходж/,/credit/],/залишок|balance|ліміт/),
  };
  if(map.debit>=0&&map.credit>=0&&(map.amount===map.debit||map.amount===map.credit))map.amount=-1;
  let cur="UAH";const ah=h[map.amount]||"";
  const cm=ah.match(/\((uah|eur|usd)\)/i)||ah.match(/\b(uah|eur|usd|грн)\b/i);
  if(cm)cur=cm[1].toUpperCase()==="ГРН"?"UAH":cm[1].toUpperCase();

}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)})}
async function pdfRows(buf){
  if(!window.pdfjsLib){await loadScript("pdf.min.js");pdfjsLib.GlobalWorkerOptions.workerSrc="pdf.worker.min.js"}
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  const lines=[];let textLen=0;
  for(let pn=1;pn<=pdf.numPages;pn++){const page=await pdf.getPage(pn);const tc=await page.getTextContent();
    const its=tc.items.filter(t=>t.str&&t.str.trim()).map(t=>({x:t.transform[4],y:t.transform[5],w:t.width||t.str.length*4,s:t.str,h:Math.abs(t.transform[3])||8}));
    textLen+=its.length;its.sort((a,b)=>b.y-a.y||a.x-b.x);
    const rows=[];for(const it of its){const r=rows.find(r=>Math.abs(r.y-it.y)<=Math.max(2,it.h*0.35));if(r)r.items.push(it);else rows.push({y:it.y,items:[it],page:pn})}
    for(const r of rows){r.items.sort((a,b)=>a.x-b.x);const cells=[];for(const it of r.items){const last=cells[cells.length-1];const gap=last?it.x-last.x1:99;
        if(last&&gap<Math.max(3,it.h*0.6))(last.t+=(gap>1?" ":"")+it.s,last.x1=Math.max(last.x1,it.x+it.w));else cells.push({x0:it.x,x1:it.x+it.w,t:it.s})}
      lines.push({cells,page:r.page})}}
  if(!textLen)throw new Error("scan");
  const low=c=>c.t.toLowerCase();
  const hi=lines.findIndex(l=>l.cells.some(c=>/дата|date/.test(low(c)))&&l.cells.some(c=>/сум|amount|дебет|кредит|списан|зарахув|debit|credit/.test(low(c))));
  if(hi<0)throw new Error("nohead");
  let head=lines[hi].cells.map(c=>({...c}));
  // header may span 2 lines: merge next line cells that sit under header columns
  const nxt=lines[hi+1];let start=hi+1;
  if(nxt&&!nxt.cells.some(c=>/\d{1,2}[./]\d{1,2}[./]\d{2,4}/.test(c.t))&&nxt.cells.length<=head.length+2){for(const c of nxt.cells){const k=nearest(head,c);if(k>=0)head[k].t+=" "+c.t}start=hi+2}
  function nearest(cols,c){const cx=(c.x0+c.x1)/2;let best=-1,bd=1e9;cols.forEach((h,i)=>{const ov=Math.min(h.x1,c.x1)-Math.max(h.x0,c.x0);const d=ov>0?-ov:Math.min(Math.abs(cx-(h.x0+h.x1)/2),Math.abs(cx-h.x0),Math.abs(cx-h.x1));if(d<bd){bd=d;best=i}});return best}
  const headTxt=head.map(c=>c.t.toLowerCase().replace(/\s+/g," ").trim());
  const dateCol=headTxt.findIndex(t=>/дата|date/.test(t));
  const out=[head.map(c=>c.t.replace(/\s+/g," ").trim())];let cur=null;
  for(let i=start;i<lines.length;i++){const l=lines[i];const lt=l.cells.map(low).join(" ");
    if(l.cells.length>=2&&headTxt.filter(h=>h&&lt.includes(h.split(" ")[0])).length>=Math.min(3,head.length))continue; // repeated header
    const row=Array(head.length).fill("");for(const c of l.cells){const k=nearest(head,c);row[k]=(row[k]?row[k]+" ":"")+c.t}
    if(parseDate(row[dateCol]||"")){cur=row;out.push(row)}
    else if(cur){row.forEach((v,k)=>{if(v)cur[k]=(cur[k]?cur[k]+" ":"")+v})}}
  return out}
async function readFile(file){
  const buf=await file.arrayBuffer();
  if(/\.pdf$/i.test(file.name)||file.type==="application/pdf")return {pdf:await pdfRows(buf)};
  if(/\.csv$|\.txt$/i.test(file.name)||file.type==="text/csv"){
    let text=new TextDecoder("utf-8").decode(buf);
    if((text.match(/\uFFFD/g)||[]).length>3){try{text=new TextDecoder("windows-1251").decode(buf)}catch(e){}}
    text=text.replace(/^﻿/,"");
    return XLSX.read(text,{type:"string",raw:true});
  }
  return XLSX.read(buf,{type:"array"});
}
const imp={rows:[],det:null,items:[]};
function buildItems(){
  const {rows,det}=imp;const m=det.map;const keys=new Set(state.tx.map(t=>t.importKey).filter(Boolean));
  const out=[];
  for(let i=det.hi+1;i<rows.length;i++){
    const r=rows[i];const date=parseDate(r[m.date]);
    let a=m.amount>=0?parseNum(r[m.amount]):NaN;
    if(!isFinite(a)&&(m.debit>=0||m.credit>=0)){const db=m.debit>=0?parseNum(r[m.debit]):NaN,cr=m.credit>=0?parseNum(r[m.credit]):NaN;
      if(isFinite(cr)&&cr!==0)a=Math.abs(cr);else if(isFinite(db)&&db!==0)a=-Math.abs(db)}
    if(!date||!isFinite(a)||a===0)continue;
    const desc=m.desc>=0?String(r[m.desc]).trim():"";const bankCat=m.cat>=0?String(r[m.cat]):"";const mcc=m.mcc>=0?r[m.mcc]:"";
    const isInc=a>0;const key=[date,a.toFixed(2),det.cur,desc.slice(0,40)].join("|");
    const dup=keys.has(key);const cand={type:isInc?"inc":"exp",cur:det.cur,amount:Math.abs(a),date};
    const manual=!dup&&state.tx.some(t=>!t.importKey&&!t.example&&sameOp(t,cand));
    const g=guessCat(desc,bankCat,mcc,isInc);
    out.push({manual,date,amount:Math.abs(a),type:isInc?"inc":"exp",dir:isInc?"in":"out",cur:det.cur,note:desc.slice(0,80),cat:g,cat0:g,importKey:key,dup,on:!dup&&!manual,skip:SKIP_RE.test(desc+" "+bankCat)});
  }
  classifyImport(out);
  imp.items=out.sort((a,b)=>b.date.localeCompare(a.date));
}

  <li><b>Інші банки (зокрема Райффайзен):</b> підійде і PDF-виписка, якщо це текстовий файл з банку, а не скан.</li>
  <li>Тут натисніть «Вибрати файл» і знайдіть його в «Файлах».</li></ol>
  <span>Назви пунктів у застосунках банків можуть трохи відрізнятися після оновлень. Файл обробляється на Вашому телефоні: у гаманець потрапляють лише дата, сума, опис і категорія, номер картки не зберігається.</span></div>`}
function openImport(){
  if(!window.XLSX){toast("Модуль імпорту ще завантажується, спробуйте за кілька секунд");return}
  openSheet("Імпорт виписки",`<div style="display:grid;gap:12px">${impHelp()}
    <label class="btn" for="impFile" style="text-align:center">Вибрати файл</label>
    <input id="impFile" type="file" accept=".pdf,application/pdf,.csv,.xls,.xlsx,.txt,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    <div id="impOut"></div></div>`,()=>{
      document.getElementById("impFile").onchange=async e=>{
        const f=e.target.files[0];if(!f)return;const out=document.getElementById("impOut");
        out.innerHTML=`<div class="note">Читаю «${esc(f.name)}»…</div>`;
        try{
          const wb=await readFile(f);let found=null,rows=null;
          if(wb.pdf){rows=wb.pdf;found=detect(rows)}
          else for(const n of wb.SheetNames){const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""});const d=detect(r);if(d){found=d;rows=r;break}}
          if(!found){out.innerHTML=`<div class="note" style="color:var(--bad)">Не знайшла в файлі колонок «Дата» і «Сума». Перевірте, що це виписка операцій. Якщо це PDF, спробуйте завантажити з банку Excel або CSV.</div>`;return}
          imp.rows=rows;imp.det=found;buildItems();renderImport();
        }catch(err){out.innerHTML=`<div class="note" style="color:var(--bad)">${err&&err.message==="scan"?"У цьому PDF немає тексту: схоже, це скан або фото. Такий файл прочитати не вийде, завантажте з банку звичайну виписку.":err&&err.message==="nohead"?"У PDF не знайшла таблиці з колонками «Дата» і «Сума». Надішліть файл Claude, щоб налаштувати розпізнавання саме Вашого банку.":err&&err.message==="load"?"Модуль читання PDF не завантажився. Перевірте інтернет і спробуйте ще раз.":"Файл не вдалося прочитати. Підходять формати .pdf, .xlsx, .xls і .csv."}</div>`}
      };
    });
}
function renderImport(){
  const out=document.getElementById("impOut");const {det,items}=imp;const h=det.header;
  const opt=(sel,allowNone)=>(allowNone?`<option value="-1" ${sel<0?"selected":""}>— немає —</option>`:"")+h.map((c,i)=>`<option value="${i}" ${i===sel?"selected":""}>${esc(c||"колонка "+(i+1))}</option>`).join("");
  const on=items.filter(x=>x.on);const dups=items.filter(x=>x.dup).length;
  out.innerHTML=`<div style="display:grid;gap:12px">
    <details><summary style="cursor:pointer;font-weight:600">Колонки файлу (перевірте, якщо щось не так)</summary>
    <div class="grid2" style="margin-top:10px">
      <label class="f" for="mDate">Дата<select id="mDate" data-map="date">${opt(det.map.date)}</select></label>
      <label class="f" for="mAmt">Сума<select id="mAmt" data-map="amount">${opt(det.map.amount)}</select></label>
      <label class="f" for="mDesc">Опис<select id="mDesc" data-map="desc">${opt(det.map.desc,1)}</select></label>
      <label class="f" for="mCat">Категорія банку<select id="mCat" data-map="cat">${opt(det.map.cat,1)}</select></label>
      <label class="f" for="mCur">Валюта рахунку<select id="mCur">${curOptions(det.cur)}</select></label>
    </div></details>
    <label class="f" for="impAcc">Рахунок для цієї виписки<select id="impAcc">${accOptions(imp.acc||"raif")}</select></label>
    <div class="note">Знайдено ${items.length} операцій${dups?`, з них ${dups} вже є в гаманці`:""}. ${items.some(x=>x.type==="tr")?`Перекази (${items.filter(x=>x.type==="tr").length}) я позначила окремо: вони не рахуються ні в доходах, ні у витратах.${items.some(x=>x.ask)?" Рядки з жовтою позначкою перевірте: це дохід чи переказ?":""}`:""} Перевірте категорії.</div>
    <div class="imp-list">${items.map((x,i)=>`<div class="imp-row ${x.dup?"dup":""}">
      <input type="checkbox" id="ic${i}" data-i="${i}" ${x.on?"checked":""} ${x.dup?"disabled":""} aria-label="Імпортувати">
      <div style="min-width:0"><label for="ic${i}" style="font-weight:600;overflow-wrap:anywhere">${esc(x.note||"Без опису")}</label><br><small>${x.date.split("-").reverse().join(".")}${x.dup?" · вже є":x.manual?" · схоже, вже внесено вручну":""}${x.reason?` · <span class="${x.ask?"trq":""}">${esc(x.reason)}</span>`:""}</small><br>
      <select class="tsel" id="ityp${i}" data-ti="${i}" aria-label="Тип">${x.dir==="in"?`<option value="inc" ${x.type==="inc"?"selected":""}>Дохід</option><option value="cash" ${x.type==="tr"&&x.cash?"selected":""}>З готівки</option>`:`<option value="exp" ${x.type==="exp"?"selected":""}>Витрата</option>`}<option value="tr" ${x.type==="tr"&&!x.cash?"selected":""}>${x.dir==="in"?"Між своїми рахунками":"Переказ собі"}</option></select>${x.type==="tr"?"":`<select id="icat${i}" data-ci="${i}" aria-label="Категорія">${catOptions(x.type,x.cat)}</select>`}</div>
      <div class="amt ${x.type==="inc"?"inc":""}" style="${x.type==="tr"?"color:var(--muted)":""}">${x.type==="tr"&&x.cash?"⇄ ":x.type==="tr"?(x.dir==="in"?"↓ ":"↑ "):x.type==="inc"?"+":"−"}${money(x.amount,x.cur)}</div></div>`).join("")||`<div class="empty">Нових операцій немає.</div>`}</div>
    <div class="prog" id="impProg" hidden><i></i></div>
    <button class="btn" id="impGo" ${on.length?"":"disabled"}>Додати ${on.length} операцій</button></div>`;
  out.querySelectorAll("[data-map]").forEach(s=>s.onchange=()=>{det.map[s.dataset.map]=+s.value;buildItems();renderImport()});
  document.getElementById("mCur").onchange=e=>{det.cur=e.target.value;buildItems();renderImport()};
  out.querySelectorAll("[data-i]").forEach(c=>c.onchange=()=>{items[+c.dataset.i].on=c.checked;const n=items.filter(x=>x.on).length;const b=document.getElementById("impGo");b.textContent=`Додати ${n} операцій`;b.disabled=!n});
  out.querySelectorAll("[data-ci]").forEach(s=>s.onchange=()=>{items[+s.dataset.ci].cat=s.value});
  out.querySelectorAll("[data-ti]").forEach(s=>s.onchange=()=>{const x=items[+s.dataset.ti];x.ask=false;x.cash=s.value==="cash";x.type=s.value==="cash"?"tr":s.value;x.cat=x.type==="tr"?TR_CAT:x.cat0;renderImport()});
  document.getElementById("impGo").onclick=runImport;
  document.getElementById("impAcc").onchange=e=>{imp.acc=e.target.value};
}
let importing=false;
async function runImport(){
  if(importing)return;
  const have=new Set(state.tx.map(t=>t.importKey).filter(Boolean));
  const list=imp.items.filter(x=>x.on&&!x.dup&&!have.has(x.importKey));if(!list.length){toast("Ці операції вже є в гаманці");return}
  importing=true;
  const btn=document.getElementById("impGo");btn.disabled=true;const pr=document.getElementById("impProg");pr.hidden=false;
  const c=new Date().toISOString();let ok=0;
  const iacc=imp.acc||"raif";
  const docs=list.map(x=>({type:x.type,dir:x.dir,acc:x.cash?"cash":iacc,to:x.cash?iacc:undefined,amount:x.amount,cur:x.cur,cat:x.type==="tr"?TR_CAT:x.cat,prevCat:x.type==="tr"?x.cat0:undefined,note:x.note,date:x.date,created:c,src:"import",importKey:x.importKey})).map(d=>{if(d.prevCat===undefined)delete d.prevCat;if(d.to===undefined)delete d.to;if(d.to)delete d.dir;return d});
  if(state.mode==="db"){
    for(const d of docs){
      let tries=0;
      while(true){try{await txCol.add(d);ok++;break}catch(e){
        if(e&&e.code==="quota_exceeded"){toast("Сховище заповнене: видаліть старі операції");tries=9}
        if(++tries>2)break;await new Promise(r=>setTimeout(r,1500*tries))}}
      if(tries>8)break;
      pr.firstElementChild.style.width=(ok/docs.length*100)+"%";btn.textContent=`Додаю… ${ok} з ${docs.length}`;
    }
  }else{for(const d of docs)state.tx.push({...d,id:uid()});ok=docs.length;lsSave()}
  importing=false;closeSheet();state.month=docs[0].date.slice(0,7);state.tab="ops";render();
  toast(ok===docs.length?`Додано ${ok} операцій`:`Додано ${ok} з ${docs.length}. Решту спробуйте ще раз: дублікати пропустяться`);
}

/* ---------- transfers ---------- */
const TOPUP_RE=/поповн|переказ|перевод|грошові перекази|з картки|на картку|card2card|p2p|transfer/i;
const SALARY_RE=/зарплат|заробітн|salary|аванс|премі/i;
const near=(a,b)=>Math.abs(a-b)<=0.05*Math.max(a,b);
function findPairs(items){const ins=items.filter(x=>x.type==="inc"),outs=items.filter(x=>x.type==="exp");const used=new Set();const pairs=[];
  for(const i of ins.sort((a,b)=>a.date.localeCompare(b.date))){if(SALARY_RE.test(i.note||""))continue;let best=null,bs=1e9;
    for(const o of outs){if(used.has(o)||(o.cur||"UAH")!==(i.cur||"UAH")||dayDiff(i.date,o.date)>2||!near(+i.amount,+o.amount))continue;
      const sc=Math.abs(i.amount-o.amount)/Math.max(i.amount,1)*10+dayDiff(i.date,o.date)+(o.date<i.date?0.5:0);if(sc<bs){bs=sc;best=o}}
    if(best){used.add(best);pairs.push([i,best])}}return pairs}
function cashMatch(x,manualIncs,taken){return manualIncs.find(m=>!taken.has(m)&&(m.cur||"UAH")===(x.cur||"UAH")&&m.date<=x.date&&dayDiff(m.date,x.date)<=7&&near(+m.amount,+x.amount))}
function classifyImport(items){const live=items.filter(x=>!x.dup);
  for(const x of live)if(x.skip){x.type="tr";x.cat=TR_CAT;x.reason="переказ між своїми рахунками"}
  const manual=state.tx.filter(t=>!t.importKey&&!t.example&&t.type==="inc");const taken=new Set();
  for(const x of live.filter(x=>x.type==="inc")){const m=cashMatch(x,manual,taken);if(m){taken.add(m);x.type="tr";x.cash=true;x.cat=TR_CAT;x.manual=false;x.on=!x.dup;x.reason=`Готівка → Картка: схоже, Ваша готівка («${(m.note||m.cat).slice(0,20)}» ${m.date.slice(8,10)}.${m.date.slice(5,7)})`}}
  for(const x of live.filter(x=>x.type==="inc")){if(SALARY_RE.test(x.note||""))continue;
    if(/поповн|термінал|банкомат|готівк|cash/i.test(x.note||"")){x.type="tr";x.cash=true;x.cat=TR_CAT;x.ask=true;x.reason="поповнення: з Вашої готівки? Якщо ні — оберіть «Дохід»"}
    else if(TOPUP_RE.test(x.note||"")){x.ask=true;x.reason="переказ Вам: дохід, повернення боргу чи з Вашої готівки?"}}}
function transferCandidates(){const base=state.tx.filter(t=>t.type!=="tr"&&!t.example);const out=[];const marked=new Set();
  const manual=base.filter(t=>!t.importKey&&t.type==="inc");const taken=new Set();
  for(const x of base.filter(t=>t.importKey&&t.type==="inc"&&!marked.has(t))){const m=cashMatch(x,manual,taken);if(m){taken.add(m);marked.add(x);out.push({ids:[x.id],cash:true,label:x.note||x.cat,sub:`+${money(x.amount,x.cur)} · Готівка → Картка (схоже, «${(m.note||m.cat).slice(0,20)}»)`,on:true})}}
  for(const x of base.filter(t=>t.importKey&&t.type==="inc"&&!marked.has(t)&&TOPUP_RE.test(t.note||"")&&!SALARY_RE.test(t.note||"")))out.push({ids:[x.id],label:x.note||x.cat,sub:`+${money(x.amount,x.cur)} · поповнення: дохід чи з Вашої готівки?`,on:false});
  return out}
function trPatch(t){return t.type==="tr"?{type:t.dir==="in"?"inc":"exp",cat:t.prevCat||(t.dir==="in"?"Інше (дохід)":"Інше")}:{type:"tr",dir:t.type==="inc"?"in":"out",prevCat:t.cat,cat:TR_CAT}}
async function patchTx(t,patch){if(state.mode==="db"){try{await txCol.doc(t.id).update(patch)}catch(e){toast("Не вдалося змінити")}}else{Object.assign(t,patch);lsSave()}}
async function toggleTr(id){const t=state.tx.find(x=>x.id===id);if(!t)return;if(t.to){toast("Це переказ між Вашими рахунками. Щоб змінити, видаліть його свайпом вліво");return}const was=t.type==="tr";await patchTx(t,{...trPatch(t),manualTr:true});render();toast(was?"Знову рахується":"Позначено як переказ: не рахується")}
function findTransfersSheet(){const c=transferCandidates();if(!c.length){toast("Переказів не знайдено");return}
  openSheet("Перекази",`<div class="note">Позначені галочкою операції стануть переказами: вони не рахуватимуться ні в доходах, ні у витратах. Поповнення, схожі на Вашу готівку, я позначила сама: вони стануть «Готівка → Картка». Решта поповнень — на Ваш розсуд.</div>
    <div class="imp-list">${c.map((x,k)=>`<div class="imp-row"><input type="checkbox" id="tf${k}" data-tf="${k}" ${x.on?"checked":""} aria-label="Позначити як переказ">
      <div style="min-width:0"><label for="tf${k}" style="font-weight:600;overflow-wrap:anywhere">${esc(x.label)}</label><br><small>${esc(x.sub)}</small></div><span></span></div>`).join("")}</div>
    <button class="btn" id="tfGo">Позначити як перекази</button>`,()=>{
      document.getElementById("tfGo").onclick=async()=>{let n=0;for(const [k,x] of c.entries()){if(!document.getElementById("tf"+k)?.checked)continue;
        for(const id of x.ids){const t=state.tx.find(z=>z.id===id);if(t&&t.type!=="tr"){await patchTx(t,x.cash?{type:"tr",acc:"cash",to:t.acc||"raif",prevCat:t.cat,cat:TR_CAT}:trPatch(t));n++}}}
        closeSheet();render();toast(`Позначено переказами: ${n}`)}})}

/* ---------- swipe to delete ---------- */
let undoBuf=null,undoTimer=null;
async function deleteWithUndo(id){const t=state.tx.find(x=>x.id===id);if(!t)return;const copy={...t};
  await delTx(id);undoBuf=copy;const u=document.getElementById("undo");document.getElementById("undoText").textContent="Видалено: "+(copy.note||copy.cat).slice(0,28);u.hidden=false;
  clearTimeout(undoTimer);undoTimer=setTimeout(()=>{u.hidden=true;undoBuf=null},5000)}
document.getElementById("undoBtn").onclick=async()=>{if(!undoBuf)return;const t=undoBuf;undoBuf=null;document.getElementById("undo").hidden=true;
  if(state.mode==="db"){const {id,...rest}=t;await addTx(rest)}else{state.tx.push(t);lsSave();render()}toast("Повернуто")};
(function(){const OPEN=96,OPENL=120;let sw=null,openEl=null;
  const setX=(el,x)=>{el.querySelector(".item").style.transform=x?`translateX(${x}px)`:""};
  const closeOpen=except=>{if(openEl&&openEl!==except){setX(openEl,0);openEl=null}};
  const view=document.getElementById("view");
  view.addEventListener("pointerdown",e=>{const el=e.target.closest(".sw");if(e.target.closest(".sw-del,.sw-tr"))return;closeOpen(el);
    if(!el)return;sw={el,x0:e.clientX,y0:e.clientY,base:openEl===el?(el._open||0):0,dir:null,id:e.pointerId,x:0}});
  view.addEventListener("pointermove",e=>{if(!sw)return;const dx=e.clientX-sw.x0,dy=e.clientY-sw.y0;
    if(!sw.dir){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){sw.dir="h";sw.el.classList.add("drag");try{sw.el.setPointerCapture(sw.id)}catch(err){}}else if(Math.abs(dy)>8){sw=null;return}else return}
    const x=sw.base+dx;sw.x=x;setX(sw.el,x)});
  const end=()=>{if(!sw)return;const s=sw;sw=null;if(s.dir!=="h")return;s.el.classList.remove("drag");const w=s.el.offsetWidth;
    if(s.x<-w*0.55){s.el.querySelector(".item").style.transform=`translateX(${-w}px)`;openEl=null;setTimeout(()=>deleteWithUndo(s.el.dataset.sw),180)}
    else if(s.x>w*0.5){setX(s.el,0);openEl=null;toggleTr(s.el.dataset.sw)}
    else if(s.x<-48){setX(s.el,-OPEN);s.el._open=-OPEN;openEl=s.el}
    else if(s.x>48){setX(s.el,OPENL);s.el._open=OPENL;openEl=s.el}
    else{setX(s.el,0);s.el._open=0;if(openEl===s.el)openEl=null}};
  view.addEventListener("pointerup",end);view.addEventListener("pointercancel",()=>{if(sw){setX(sw.el,sw.base);sw=null}});
  view.addEventListener("click",e=>{const b=e.target.closest("[data-swdel]");if(b){e.stopPropagation();openEl=null;deleteWithUndo(b.dataset.swdel);return}
    const tb=e.target.closest("[data-swtr]");if(tb){e.stopPropagation();openEl=null;toggleTr(tb.dataset.swtr)}},true);
  document.addEventListener("pointerdown",e=>{if(!e.target.closest(".sw"))closeOpen(null)});
})();

/* ---------- events ---------- */
document.getElementById("fab").onclick=openTxForm;
document.getElementById("mPrev").onclick=()=>{state.month=shiftMonth(state.month,-1);render()};
document.getElementById("mNext").onclick=()=>{state.month=shiftMonth(state.month,1);render()};
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();window.scrollTo(0,0)});

document.getElementById("view").addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.id==="seed")return seedExamples();
  if(t.dataset.import)return openImport();
  if(t.id==="bkSave")return exportBackup();
  if(t.dataset.goto){state.tab=t.dataset.goto;render();window.scrollTo(0,0);return}
  if(t.id==="addRec")return openRecForm();
  if(t.id==="dedupe")return dedupe();
  if(t.id==="accSetup")return setupSheet();
  if(t.id==="accMove")return moveSheet();
  if(t.dataset.recon)return reconSheet(t.dataset.recon);
  if(t.dataset.accf){state.accFilter=t.dataset.accf;render();return}
  if(t.id==="findTr")return findTransfersSheet();
  if(t.dataset.del){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Точно видалити?";setTimeout(()=>{t.classList.remove("armed");t.textContent="Видалити"},3000);return}
    await delTx(t.dataset.del);toast("Операцію видалено");return}
  if(t.dataset.delrec){if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Точно видалити?";setTimeout(()=>{t.classList.remove("armed");t.textContent="Видалити"},3000);return}
    state.settings.recurring=state.settings.recurring.filter(r=>r.id!==t.dataset.delrec);saveSettings();render();return}
  if(t.dataset.pay){const r=state.settings.recurring.find(x=>x.id===t.dataset.pay);if(!r)return;const m=ym(new Date());
    r.paid=[...new Set([...(r.paid||[]).filter(p=>p>=shiftMonth(m,-12)),m])];saveSettings();
    await addTx({type:"exp",amount:Number(r.amount),cur:r.cur,cat:r.cat,note:r.name,date:today(),created:new Date().toISOString()});
    render();toast("Записано як витрату")}
});
let limTimer=null;
document.getElementById("view").addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="bkFile"&&el.files[0]){importBackup(el.files[0]);el.value="";return}
  if(el.dataset.lim!==undefined){const v=parseFloat(el.value);const b={...(state.settings.budgets||{})};if(v>0)b[el.dataset.lim]=v;else delete b[el.dataset.lim];state.settings.budgets=b;saveSettings();render();toast("Ліміт збережено")}
  if(el.dataset.rate){const v=parseFloat(el.value);if(v>0){state.settings.rates={...state.settings.rates,[el.dataset.rate]:v};saveSettings();render();toast("Курс оновлено")}}
});

async function seedExamples(){
  const m=state.month;const d=n=>m+"-"+String(n).padStart(2,"0");const c=new Date().toISOString();
  const ex=[["inc",32000,"UAH","Зарплата","Зарплата (приклад)",1],["exp",1450,"UAH","Продукти","Сільпо (приклад)",2],["exp",380,"UAH","Кафе","Кава з колегами (приклад)",3],
    ["exp",250,"EUR","Житло","Оренда (приклад)",5],["exp",620,"UAH","Транспорт","Таксі (приклад)",6],["exp",12.99,"USD","Підписки","Підписка (приклад)",7]];
  for(const [type,amount,cur,cat,note,day] of ex) await addTx({type,amount,cur,cat,note,date:d(day),created:c,example:true});
  toast("Додано приклади. Їх можна видалити");
}

render();
initStore();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
